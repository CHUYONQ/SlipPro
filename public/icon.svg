<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Terminal Body -->
  <rect x="136" y="230" width="240" height="190" rx="32" fill="#1e293b" />
  
  <!-- Card Reader Slot -->
  <rect x="176" y="210" width="160" height="20" rx="8" fill="#0f172a" />
  
  <!-- Slip (Receipt) coming out of top -->
  <polygon points="186,80 326,80 326,220 312,232 298,220 284,232 270,220 256,232 242,220 228,232 214,220 200,232 186,220" fill="#f8fafc" />
  
  <!-- Cute Face on Slip -->
  <circle cx="230" cy="130" r="8" fill="#0f172a" />
  <circle cx="282" cy="130" r="8" fill="#0f172a" />
  <path d="M246 142 Q256 152 266 142" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <circle cx="212" cy="140" r="6" fill="#f43f5e" opacity="0.6" />
  <circle cx="300" cy="140" r="6" fill="#f43f5e" opacity="0.6" />

  <!-- Text Lines on Slip -->
  <rect x="210" y="170" width="92" height="8" rx="4" fill="#cbd5e1" />
  <rect x="210" y="190" width="60" height="8" rx="4" fill="#cbd5e1" />
  
  <!-- Terminal Screen -->
  <rect x="166" y="260" width="180" height="90" rx="16" fill="#334155" />
  
  <!-- Green Checkmark on Screen -->
  <circle cx="256" cy="305" r="24" fill="#10b981" />
  <path d="M244 305 L252 313 L268 297" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Button -->
  <rect x="226" y="375" width="60" height="12" rx="6" fill="#475569" />
  
  <!-- Sparkles -->
  <path d="M370 120 Q385 120 385 105 Q385 120 400 120 Q385 120 385 135 Q385 120 370 120" fill="#10b981" />
  <path d="M100 200 Q110 200 110 190 Q110 200 120 200 Q110 200 110 210 Q110 200 100 200" fill="#38bdf8" />
</svg>
